# Pages CMS 설정 — https://app.pagescms.org 에서 이 저장소를 열면 아래 메뉴가 보입니다.
# 저장하면 GitHub Actions가 사이트를 다시 만들어 1~2분 뒤 반영됩니다.
# 영문 사이트(/en/) 문구는 각 항목의 '영문 (English)' 칸에 적습니다. 비워두면 한국어가 그대로 나옵니다.
media:
  input: img
  output: /img
  categories: [image]
  rename: safe

content:
  - name: site
    label: 사이트 문구 (홈 · About · 연락처)
    type: file
    path: content/site.yml
    format: yaml
    fields:
      - name: home
        label: 홈
        type: object
        fields:
          - { name: headline, label: 메인 제목 (뒤에 STANDS가 붙습니다), type: string, description: "예: 예술이 필요한 곳에," }
          - { name: story_1, label: 소개 첫 문단, type: text }
          - { name: story_2, label: 소개 둘째 문단 (WHERE ART STANDS 아래), type: text }
          - name: services
            label: What we do 항목
            type: object
            list: true
            fields:
              - { name: label, label: 영문 라벨, type: string, description: "예: 01 · ART ADVISORY" }
              - { name: title, label: 제목, type: string }
              - { name: text, label: 설명, type: text }
              - { name: title_en, label: 제목 (영문), type: string }
              - { name: text_en, label: 설명 (영문), type: text }
          - name: featured_projects
            label: 홈에 보여줄 프로젝트 (순서대로, 3개 권장)
            type: reference
            options: { collection: projects, multiple: true, max: 6, search: title, value: "{path}", label: "{title}" }
          - name: featured_artists
            label: 홈에 보여줄 작가 (순서대로, 4개 권장)
            type: reference
            options: { collection: artists, multiple: true, max: 8, search: name, value: "{path}", label: "{name}" }
          - name: featured_article
            label: 홈 에디토리얼 영역에 보여줄 글 (비우면 최신 글)
            type: reference
            options: { collection: editorial, search: title, value: "{path}", label: "{title}" }
          - { name: cta_title, label: 하단 문의 영역 문장, type: string }
          - { name: cta_button, label: 하단 문의 버튼, type: string }
          - name: en
            label: 영문 (English)
            type: object
            fields:
              - { name: headline, label: 메인 제목 (영문), type: string, description: "예: Where art is needed," }
              - { name: story_1, label: 소개 첫 문단 (영문), type: text }
              - { name: story_2, label: 소개 둘째 문단 (영문), type: text }
              - { name: cta_title, label: 하단 문의 영역 문장 (영문), type: string }
              - { name: cta_button, label: 하단 문의 버튼 (영문), type: string }
      - name: about
        label: About
        type: object
        fields:
          - { name: paragraphs, label: 회사 소개 문단, type: text, list: true }
          - { name: closing, label: 마지막 강조 문장, type: string }
          - name: what_we_do
            label: What we do 목록
            type: object
            list: true
            fields:
              - { name: label, label: 라벨, type: string }
              - { name: text, label: 내용, type: string }
              - { name: text_en, label: 내용 (영문), type: string }
          - { name: cta_title, label: 하단 문의 영역 문장, type: string }
          - { name: cta_button, label: 하단 문의 버튼, type: string }
          - name: en
            label: 영문 (English)
            type: object
            fields:
              - { name: paragraphs, label: 회사 소개 문단 (영문), type: text, list: true }
              - { name: closing, label: 마지막 강조 문장 (영문), type: string }
              - { name: cta_title, label: 하단 문의 영역 문장 (영문), type: string }
              - { name: cta_button, label: 하단 문의 버튼 (영문), type: string }
      - name: pages
        label: 목록 페이지 안내 문구
        type: object
        fields:
          - { name: projects_lead, label: Projects 페이지 안내, type: text }
          - { name: artists_lead, label: Artists 페이지 안내, type: text }
          - { name: editorial_lead, label: Editorial 페이지 안내, type: text }
          - name: en
            label: 영문 (English)
            type: object
            fields:
              - { name: projects_lead, label: Projects 페이지 안내 (영문), type: text }
              - { name: artists_lead, label: Artists 페이지 안내 (영문), type: text }
              - { name: editorial_lead, label: Editorial 페이지 안내 (영문), type: text }
      - name: contact
        label: 연락처
        type: object
        fields:
          - { name: lead, label: Contact 페이지 안내, type: text }
          - { name: email, label: 이메일, type: string }
          - { name: address, label: 주소, type: string }
          - { name: tel, label: 전화, type: string }
          - { name: instagram, label: 인스타그램, type: string }
          - { name: form_types, label: 문의 유형 선택지, type: string, list: true }
          - name: en
            label: 영문 (English)
            type: object
            fields:
              - { name: lead, label: Contact 페이지 안내 (영문), type: text }
              - { name: address, label: 주소 (영문), type: string }
              - { name: form_types, label: 문의 유형 선택지 (영문), type: string, list: true }
      - name: company
        label: 사업자 정보 (푸터)
        type: object
        fields:
          - { name: name, label: 상호, type: string }
          - { name: ceo, label: 대표자, type: string }
          - { name: business_no, label: 사업자등록번호, type: string }
          - { name: art_service_no, label: 미술서비스업 신고번호, type: string }
          - { name: ecommerce_no, label: 통신판매업 신고번호, type: string }
          - name: en
            label: 영문 (English)
            type: object
            fields:
              - { name: name, label: 상호 (영문), type: string }
              - { name: ceo, label: 대표자 (영문), type: string }

  - name: projects
    label: 프로젝트
    type: collection
    path: content/projects
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      fields: [title, type, location, order, hidden]
      sort: [order, title]
      default: { sort: order, order: asc }
    fields:
      - { name: title, label: 프로젝트명, type: string, required: true }
      - name: type
        label: 분류
        type: select
        options:
          values:
            - { name: space, label: 공간 프로젝트 }
            - { name: public, label: 공공미술 }
            - { name: exhibition, label: 전시 }
            - { name: trade, label: 거래 · 자문 }
            - { name: handling, label: 제작 · 설치 }
      - { name: location, label: 위치, type: string, description: "예: 서울 중구" }
      - { name: year, label: 연도, type: string }
      - { name: size, label: 규모, type: string, description: "예: H 6,000 또는 작품 12점" }
      - name: artist
        label: 작가
        type: reference
        options: { collection: artists, search: name, value: "{path}", label: "{name}" }
      - { name: client, label: 클라이언트, type: string }
      - { name: scope, label: 업무 범위, type: string, description: "예: 기획 · 제작 · 설치" }
      - { name: cover, label: 대표 사진, type: image }
      - { name: gallery, label: 추가 사진, type: image, options: { multiple: { max: 12 } } }
      - { name: summary, label: 요약 (한두 문장), type: text }
      - { name: body, label: 본문, type: rich-text, options: { format: markdown } }
      - name: en
        label: 영문 (English)
        type: object
        description: 영문 사이트에 보이는 문구입니다. 비워둔 칸은 한국어가 그대로 나옵니다.
        fields:
          - { name: title, label: 프로젝트명 (영문), type: string }
          - { name: location, label: 위치 (영문), type: string, description: "예: Jung-gu, Seoul" }
          - { name: size, label: 규모 (영문), type: string, description: "숫자만이면 비워두세요. 예: 12 works" }
          - { name: client, label: 클라이언트 (영문), type: string }
          - { name: scope, label: 업무 범위 (영문), type: string, description: "예: Planning · Fabrication · Installation" }
          - { name: summary, label: 요약 (영문), type: text }
          - { name: body, label: 본문 (영문), type: rich-text, options: { format: markdown } }
      - { name: order, label: 정렬 순서 (작을수록 앞), type: number }
      - { name: sample, label: "'예시' 표시", type: boolean, description: 실제 프로젝트면 끄세요 }
      - { name: hidden, label: 비공개, type: boolean, description: 켜면 사이트에 나오지 않습니다 }

  - name: artists
    label: 작가
    type: collection
    path: content/artists
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: name
      fields: [name, medium, order, hidden]
      sort: [order, name]
      default: { sort: order, order: asc }
    fields:
      - { name: name, label: 이름, type: string, required: true }
      - { name: medium, label: 주요 매체, type: string, description: "예: 브론즈, 석재" }
      - { name: born, label: 출생, type: string }
      - { name: based, label: 활동 지역, type: string }
      - { name: photo, label: 대표 이미지 (비우면 기본 도형), type: image }
      - { name: summary, label: 소개 (한두 문장), type: text }
      - { name: body, label: 본문, type: rich-text, options: { format: markdown } }
      - name: history
        label: 전시 · 프로젝트 이력
        type: object
        list: true
        fields:
          - { name: year, label: 연도, type: string }
          - { name: title, label: 제목, type: string }
          - { name: place, label: 장소, type: string }
          - { name: title_en, label: 제목 (영문), type: string }
          - { name: place_en, label: 장소 (영문), type: string }
      - name: en
        label: 영문 (English)
        type: object
        description: 영문 사이트에 보이는 문구입니다. 비워둔 칸은 한국어가 그대로 나옵니다.
        fields:
          - { name: name, label: 이름 (영문), type: string }
          - { name: medium, label: 주요 매체 (영문), type: string, description: "예: Bronze, stone" }
          - { name: born, label: 출생 (영문), type: string }
          - { name: based, label: 활동 지역 (영문), type: string }
          - { name: summary, label: 소개 (영문), type: text }
          - { name: body, label: 본문 (영문), type: rich-text, options: { format: markdown } }
      - { name: order, label: 정렬 순서 (작을수록 앞), type: number }
      - { name: sample, label: "'예시' 표시", type: boolean, description: 실제 작가면 끄세요 }
      - { name: hidden, label: 비공개, type: boolean, description: 켜면 사이트에 나오지 않습니다 }

  - name: editorial
    label: 에디토리얼
    type: collection
    path: content/editorial
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      fields: [issue, title, date, hidden]
      sort: [date, issue]
      default: { sort: date, order: desc }
    fields:
      - { name: title, label: 제목, type: string, required: true }
      - { name: issue, label: 호수, type: string, description: "예: 04" }
      - { name: date, label: 발행일, type: date }
      - { name: summary, label: 요약 (목록과 홈에 표시), type: text }
      - { name: cover, label: 대표 이미지, type: image }
      - { name: body, label: 본문, type: rich-text, options: { format: markdown } }
      - name: en
        label: 영문 (English)
        type: object
        description: 영문 사이트에 보이는 문구입니다. 비워둔 칸은 한국어가 그대로 나옵니다.
        fields:
          - { name: title, label: 제목 (영문), type: string }
          - { name: summary, label: 요약 (영문), type: text }
          - { name: body, label: 본문 (영문), type: rich-text, options: { format: markdown } }
      - { name: sample, label: "'예시' 표시", type: boolean }
      - { name: hidden, label: 비공개, type: boolean, description: 켜면 사이트에 나오지 않습니다 }
