home:
  headline: 예술이 필요한 곳에,
  story_1: 1917년, 화장실에 있어야 할 소변기가 전시장에 출품되었습니다. 이 사건은 작품의 의미와 가치가 장소와 맥락에서 비롯된다는 것을 보여 준 상징적인 장면입니다. 그로부터 100여 년이 지난 지금, 여전히 유효한 하나의 물음을 다시 내어놓습니다.
  story_2: ‘서다’라는 말에는 서 있는 것과 그것을 받치는 땅이 함께 담겨 있습니다. STANDS는 작품이 딛고 설 자리를 만듭니다. 작품이 놓일 맥락을 판단하고, 기획하고, 직접 설치하는 아트 컴퍼니입니다.
  services:
  - label: 01 · ART ADVISORY
    title: 작품 선정 · 거래
    text: 공간과 예산에 맞는 작품을 찾고, 구매와 판매를 진행합니다.
  - label: 02 · ART PROJECTS
    title: 아트 프로젝트 기획
    text: 기업 · 브랜드의 아트 협업과 전시를 기획하고 운영합니다.
  - label: 03 · PUBLIC ART & FABRICATION
    title: 건축물 미술작품 · 제작 설치
    text: 건축물 미술작품의 기획, 심의, 제작, 설치를 직접 수행합니다.
  featured_projects:
  - content/projects/office-lobby.md
  - content/projects/residential-plaza.md
  - content/projects/solo-exhibition.md
  featured_artists:
  - content/artists/artist-01.md
  - content/artists/artist-02.md
  - content/artists/artist-03.md
  - content/artists/artist-04.md
  featured_article: content/editorial/issue-01.md
  cta_title: 작품이 설 자리를 찾고 계신가요?
  cta_button: 프로젝트 문의
about:
  paragraphs:
  - 같은 작품도 어디에 놓이느냐에 따라 다르게 읽힙니다. 공간의 크기와 빛, 주변의 건축, 그 앞을 지나는 사람들까지 모두 작품의 일부가 됩니다. 그래서 작품을 고르는 일과 자리를 정하는 일은 나뉠 수 없습니다.
  - STANDS는 마롱컴퍼니가 10년간 조형물을 제작해 온 경험에서 출발했습니다. 공공미술과 건축물 미술작품, 대형 조각을 현장에 설치하며 확인한 것은 하나였습니다. 작품의 완성은 작업실이 아니라 설치되는 자리에서 이루어진다는 것입니다.
  - STANDS는 공간에 맞는 작품을 선별하고 거래합니다. 작품이 놓일 맥락을 기획하고, 기업과 브랜드의 아트 프로젝트와 전시를 운영합니다. 건축물 미술작품의 기획부터 심의, 제작, 설치까지 직접 수행합니다.
  closing: 작품 선정부터 설치까지, 한 팀이 맡습니다.
  what_we_do:
  - label: 01 Advisory
    text: 작품 선정 · 거래 — 공간과 예산에 맞는 작품 제안, 구매와 판매
  - label: 02 Projects
    text: 아트 프로젝트 기획 — 기업 · 브랜드 아트 협업, 전시 기획과 운영
  - label: 03 Public
    text: 건축물 미술작품 · 제작 설치 — 기획, 심의, 제작, 설치 직접 수행
  - label: Partner
    text: 마롱컴퍼니 — 제작 · 설치
  cta_title: 프로젝트를 이야기해 주세요.
  cta_button: 문의하기
