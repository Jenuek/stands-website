home:
  headline: 예술이 필요한 곳에,
  story_1: >-
    1917년, 마르셀 뒤샹은 평범한 소변기를 전시에 출품했습니다. 이 사건은 사물이 놓이는 맥락에 따라 그 의미와 가치가 달라질 수 있음을
    보여준 상징적인 장면이었습니다. 


    그로부터 100여 년이 지난 지금, STANDS는 새로운 질문에서 출발합니다. 

    ‘작품은 어디에, 어떻게 서야 하는가.’ 
  story_2: >-
    ‘서다’라는 단어에는 서 있는 것과 그것을 받치는 땅이 함께 담겨 있습니다. STANDS는 작품이 딛고 설 자리를 만듭니다. 


    작가의 고유한 시선과 공간이 지향하는 가치를 연결하고, 작품 선정부터 아트 프로젝트의 기획, 제작과 설치까지 예술적 판단과 현장의 실행을
    하나의 흐름으로 완성합니다. 


    작품이 공간에 자연스럽게 자리하고, 시간이 흐를수록 그 장소를 기억하게 하는 이유가 되도록.
  services:
    - label: 01. ART DEALING
      title: 아트 딜링· 작품 소싱과 컬렉션 관리
      text: "공간과 컬렉션의 방향에 맞는 작품을 찾아 연결합니다. 국내외 네트워크를 통해 작품을 확보하고, 가격 검토와 계약, 설치는 물론 소장
        작품의 관리와 리세일까지 컬렉션의 전 주기를 함께합니다. "
    - label: 02. ART PROJECTS
      title: 아트 프로젝트 기획
      text: 브랜드와 장소의 이야기를 예술로 풀어냅니다. 작가 커미션, 전시, 브랜드 협업을 기획하고, 작가 섭외부터 운영까지 실행합니다.
    - label: "03. ARCHITECTURAL ART "
      title: 건축물 미술작품
      text: "건축과 공간의 맥락에 맞는 작품을 제안하고 구현합니다. 건축물 미술작품의 기획과 작가 선정, 심의부터 제작, 운송·설치까지 프로젝트
        전 과정을 수행합니다. "
  featured_projects:
    - content/projects/office-lobby.md
    - content/projects/residential-plaza.md
    - content/projects/solo-exhibition.md
  featured_artists:
    - content/artists/artist-01.md
    - content/artists/artist-02.md
    - content/artists/artist-03.md
    - content/artists/artist-04.md
  featured_article: content/editorial/issue-01.md
  cta_title: 작품이 설 자리를 찾고 계신가요?
  cta_button: 프로젝트 문의
about:
  paragraphs:
    - >-
      같은 작품도 어디에, 어떻게 놓이느냐에 따라 다르게 느껴집니다. 


      공간의 크기와 빛, 주변의 건축물, 그 앞을 지나가는 사람들까지 모두 작품의 일부가 됩니다. 그래서 작품을 고르는 일과 그 위치를
      정하는 일은 나뉠 수 없습니다. 
    - "그래서 STANDS는 작품을 제안하는 순간부터 그 작품이 서게 될 자리를 함께 살핍니다. 소재와 구조, 공간의 조건과 안전을
      고려하고, 기획 단계의 의도가 설치 장소에 온전히 구현되도록 전 과정을 조율합니다. "
    - STANDS는 공간에 맞는 작품을 선별하고 거래합니다. 작품이 놓일 맥락을 기획하고, 기업과 브랜드의 아트 프로젝트와 전시를
      운영합니다. 건축물 미술작품의 기획부터 심의, 제작, 설치까지 직접 수행합니다.
  closing: 작품을 찾는 일부터 세우는 일까지, 한 팀이 책임집니다.
  what_we_do:
    - label: "01. ART DEALING "
      text: "아트 딜링· 작품 소싱과 컬렉션 관리 - 컬렉션 자문, 작품 소싱, 거래, 리세일 "
    - label: "02. ART PROJECTS "
      text: 아트 프로젝트 기획 - 작가 커미션, 브랜드 아트 협업, 전시 기획과 운영
    - label: "03. ARCHITECTURAL ART "
      text: 건축물 미술작품 - 기획, 작가 선정, 심의 대행, 작품 제작 및 설치
    - label: 04. PARTNER
      text: "마롱컴퍼니 - 공공미술 프로젝트, 조형물 기획·제작·설치 "
  cta_title: 프로젝트를 이야기해 주세요.
  cta_button: 문의하기
